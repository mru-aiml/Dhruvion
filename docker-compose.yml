version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dhruvion-backend
    environment:
      - DATABASE_URL=sqlite:///./data/dhruvion.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost}
      - API_PREFIX=/api
      - API_TITLE=DHRUVION API
      - API_VERSION=0.1.0
      - LOG_LEVEL=INFO
      - DHRUVION_DATA_DIR=/app/data
      - DATASET_STATIC_MOUNT=/static/dhruvion
      - DEFAULT_TRAVEL_SPEED_M_PER_MIN=60.0
      - LLM_ENABLED=${LLM_ENABLED:-true}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - GROQ_BASE_URL=https://api.groq.com/openai/v1
      - LLM_TIMEOUT_S=20.0
      - LLM_ANSWER_TIMEOUT_S=30.0
      - LLM_HEALTH_TIMEOUT_S=2.0
      - LLM_MAX_TOOL_ROUNDS=3
      - LLM_MAX_TOKENS=100
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_MODEL=qwen2.5-coder:3b
    volumes:
      - backend-data:/app/data
      - ./data:/app/data:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - dhruvion-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dhruvion-frontend
    environment:
      - VITE_API_BASE_URL=http://localhost/api
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - dhruvion-network

volumes:
  backend-data:
    driver: local

networks:
  dhruvion-network:
    driver: bridge