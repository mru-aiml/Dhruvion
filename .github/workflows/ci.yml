name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # Frontend Checks
  frontend-checks:
    name: Frontend (TypeScript, Lint, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compilation check
        run: npx tsc --noEmit

      - name: Lint (oxlint)
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000/api

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # Backend Tests
  backend-tests:
    name: Backend (Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Run tests
        run: |
          source .venv/bin/activate
          python -m pytest tests/ -v --tb=short

  # Security Audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Audit Node.js dependencies
        run: |
          cd frontend
          npm audit --audit-level=high || true

      - name: Audit Python dependencies
        run: |
          cd backend
          pip install pip-audit
          pip-audit -r requirements.txt || true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@v3
        with:
          path: .
          base: main
          head: HEAD
          fail: false

  # Documentation Check
  docs-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          required_files=(
            "README.md"
            "CONTRIBUTING.md"
            "LICENSE"
            "docs/data-sources.md"
            "frontend/.env.example"
            "backend/.env.example"
          )
          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "ERROR: Missing required file: $file"
              exit 1
            fi
          done
          echo "All required documentation files present."

      - name: Validate README structure
        run: |
          # Check for key sections in README
          required_sections=(
            "Installation"
            "Environment Configuration"
            "Data Sources"
            "Testing"
            "License"
          )
          for section in "${required_sections[@]}"; do
            if ! grep -q "## $section" README.md; then
              echo "WARNING: README missing section: $section"
            fi
          done

  # Overall Status
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [frontend-checks, backend-tests, security-audit, docs-check]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          if [[ "${{ needs.frontend-checks.result }}" != "success" ]]; then
            echo "Frontend checks failed"
            exit 1
          fi
          if [[ "${{ needs.backend-tests.result }}" != "success" ]]; then
            echo "Backend tests failed"
            exit 1
          fi
          if [[ "${{ needs.security-audit.result }}" != "success" ]]; then
            echo "Security audit failed"
            exit 1
          fi
          if [[ "${{ needs.docs-check.result }}" != "success" ]]; then
            echo "Documentation check failed"
            exit 1
          fi
          echo "All CI checks passed!"