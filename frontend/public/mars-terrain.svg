<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Prototype Martian terrain visualization">
  <defs>
    <radialGradient id="sky" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#7a3a22"/>
      <stop offset="55%" stop-color="#4a2416"/>
      <stop offset="100%" stop-color="#1a100a"/>
    </radialGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="7"/>
      <feColorMatrix values="0.6 0 0 0 0.2  0 0.4 0 0 0.1  0 0 0.3 0 0.05  0 0 0 0.35 0"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <rect width="1200" height="800" filter="url(#noise)" opacity="0.5"/>
  <!-- craters -->
  <g fill="none" stroke="#2a140c" stroke-width="2" opacity="0.6">
    <circle cx="260" cy="220" r="90"/>
    <circle cx="260" cy="220" r="60" opacity="0.5"/>
    <circle cx="900" cy="520" r="120"/>
    <circle cx="900" cy="520" r="80" opacity="0.5"/>
    <circle cx="620" cy="360" r="45"/>
    <circle cx="420" cy="600" r="70"/>
  </g>
  <g fill="#1a0e08" opacity="0.45">
    <circle cx="260" cy="220" r="90"/>
    <circle cx="900" cy="520" r="120"/>
    <circle cx="420" cy="600" r="70"/>
  </g>
  <!-- ridges -->
  <path d="M0 420 Q300 360 600 400 T1200 380" fill="none" stroke="#8a4a2a" stroke-width="3" opacity="0.5"/>
  <path d="M0 520 Q400 470 800 510 T1200 490" fill="none" stroke="#6a3a1e" stroke-width="2" opacity="0.4"/>
  <!-- rocks -->
  <g fill="#3a2014" opacity="0.7">
    <circle cx="180" cy="640" r="6"/>
    <circle cx="210" cy="650" r="4"/>
    <circle cx="760" cy="260" r="5"/>
    <circle cx="1080" cy="300" r="7"/>
    <circle cx="520" cy="700" r="5"/>
  </g>
  <!-- grid -->
  <g stroke="#f3f1ed" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="900" y1="0" x2="900" y2="800"/>
  </g>
</svg>